<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statecraft - Diplomacy Game</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Statecraft - Diplomacy</h1>
        <p class="subtitle">Create a new game and share unique URLs with your friends</p>

        <div class="create-game-form">
            <h2>Create New Game</h2>

            <div class="nation-selection">
                <h3>Select Nations</h3>
                <div id="nations-list"></div>
            </div>

            <div class="player-config">
                <h3>Configure Players</h3>
                <div id="players-config"></div>
            </div>

            <div class="timer-config">
                <h3>Turn Timer Settings</h3>
                <div class="timer-row">
                    <label>
                        Turn Duration:
                        <input type="number" id="turn-duration" min="1" max="168" value="24" style="width: 60px; margin: 0 5px;">
                        hours
                    </label>
                </div>
                <div class="timer-row">
                    <label>
                        Process turns at:
                        <select id="turn-time-hour" style="margin: 0 5px;">
                            <option value="0" selected>12:00 AM (Midnight)</option>
                            <option value="1">1:00 AM</option>
                            <option value="2">2:00 AM</option>
                            <option value="3">3:00 AM</option>
                            <option value="6">6:00 AM</option>
                            <option value="9">9:00 AM</option>
                            <option value="12">12:00 PM (Noon)</option>
                            <option value="15">3:00 PM</option>
                            <option value="18">6:00 PM</option>
                            <option value="20">8:00 PM</option>
                            <option value="21">9:00 PM</option>
                            <option value="22">10:00 PM</option>
                            <option value="23">11:00 PM</option>
                        </select>
                        Eastern Time
                    </label>
                </div>
                <p style="font-size: 12px; color: #666; margin-top: 10px;">
                    Turns will be automatically processed every <span id="duration-display">24</span> hours at <span id="time-display">midnight</span> ET
                </p>
            </div>

            <button id="create-game-btn" class="btn-primary">Create Game</button>
        </div>

        <div id="game-links" class="game-links hidden">
            <h2>Game Created!</h2>
            <p>Share these links with your players:</p>
            <div id="player-links"></div>

            <div class="game-controls">
                <button id="copy-all-links" class="btn-secondary">Copy All Links</button>
                <button id="start-game-btn" class="btn-primary">Start Game</button>
            </div>
        </div>
    </div>

    <script src="/js/create-game.js"></script>
</body>
</html>
